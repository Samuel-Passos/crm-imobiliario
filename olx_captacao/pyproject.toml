[project]
name = "olx-captacao"
version = "0.1.0"
description = "Módulo de captação de links e extração de dados da OLX - SJC"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44.0",
    "supabase>=2.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
